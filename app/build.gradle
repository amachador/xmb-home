plugins { id 'com.android.application' }

android {
    namespace 'com.oso.xmbhome'
    compileSdk 34
    defaultConfig {
        applicationId 'com.oso.xmbhome'
        minSdk 34        // the TV runs Android 14
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
